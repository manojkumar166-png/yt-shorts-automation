name: Generate Video

on:
  # Run daily at 03:00 IST (21:30 UTC previous day)
  schedule:
    - cron: "30 21 * * *"

  # Manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic to generate (overrides topics.txt)"
        required: false
        default: ""

  # Auto-trigger when you edit topics.txt
  push:
    paths:
      - "topics.txt"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Install ffmpeg (needed by MoviePy)
        run: sudo apt-get install -y ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate videos
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          set -e
          mkdir -p output

          # Decide what topics to generate
          if [ -n "$MANUAL_TOPIC" ]; then
            echo "Manual topic: $MANUAL_TOPIC"
            echo "$MANUAL_TOPIC" > /tmp/topics.txt
          else
            cp topics.txt /tmp/topics.txt
          fi

          echo "=== Topics to process ==="
          cat /tmp/topics.txt

          # Generate one video per non-empty line
          while IFS= read -r topic || [ -n "$topic" ]; do
            topic="$(echo "$topic" | xargs)"
            [ -z "$topic" ] && continue
            [[ "$topic" == \#* ]] && continue
            echo ""
            echo "▶ Generating: $topic"
            python main.py "$topic" || echo "⚠️ Failed: $topic"
          done < /tmp/topics.txt

          echo ""
          echo "=== Output files ==="
          ls -lh output/ || true

      - name: Upload videos as artifact
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 30
          if-no-files-found: warn