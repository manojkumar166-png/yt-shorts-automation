name: Render All Leaf Color Tutorial Shorts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/render-leaf-color-series.yml"
      - "canva-series/render_day.py"
      - "canva-series/storyboards/leaf-color/*.json"
  workflow_dispatch:
    inputs:
      prep_run_id:
        description: "Successful Prepare All Tutorial Images run ID"
        required: true
        default: "41628877178"

permissions:
  actions: read
  contents: read

concurrency:
  group: render-leaf-color-series
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Pillow>=9.5,<12" "edge-tts>=6.1.9"

      - name: Extract uploaded ZIP and prepare all 48 images
        run: python canva-series/prepare_archive.py

      - name: Arrange 48 scenes into eight six-scene videos
        shell: bash
        run: |
          set -euo pipefail
          test -f canva-series/prepared-input/manifest.csv
          for day in $(seq 1 8); do
            day_dir="canva-series/assets/day$(printf '%02d' "$day")"
            storyboard="canva-series/storyboards/leaf-color/day$(printf '%02d' "$day").json"
            mkdir -p "$day_dir"
            cp "$storyboard" "canva-series/storyboards/day$(printf '%02d' "$day").json"
            first=$(( (day - 1) * 6 + 1 ))
            for slot in $(seq 1 6); do
              source_num=$(( first + slot - 1 ))
              source_file=$(printf "canva-series/prepared-input/images/image-%03d.webp" "$source_num")
              target_file=$(printf "%s/screen-%02d.webp" "$day_dir" "$slot")
              test -f "$source_file"
              cp "$source_file" "$target_file"
            done
          done

      - name: Render all eight 30-second videos
        shell: bash
        run: |
          set -euo pipefail
          for day in $(seq 1 8); do
            python -u canva-series/render_day.py --day "$day"
          done

      - name: Validate all eight MP4 files
        shell: bash
        run: |
          set -euo pipefail
          for day in $(seq 1 8); do
            file=$(printf "canva-series/output/day%02d.mp4" "$day")
            test -s "$file"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$file"
          done

      - name: Upload complete tutorial video series
        uses: actions/upload-artifact@v4
        with:
          name: why-leaves-change-color-8-shorts
          path: canva-series/output/day*.mp4
          if-no-files-found: error
          retention-days: 14
