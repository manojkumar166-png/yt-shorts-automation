name: Prepare All Tutorial Images

on:
  workflow_dispatch:
  push:
    paths:
      - "canva-series/input/final_24MB.zip"
      - "canva-series/prepare_archive.py"
      - ".github/workflows/prepare-tutorial-images.yml"

permissions:
  contents: read

concurrency:
  group: prepare-tutorial-images
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Extract ZIP and create contact sheet
        run: python canva-series/prepare_archive.py

      - name: Upload extracted images and review files
        uses: actions/upload-artifact@v4
        with:
          name: tutorial-images-prepared
          path: canva-series/prepared-input/
          if-no-files-found: error
          retention-days: 14
