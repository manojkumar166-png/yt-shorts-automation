name: Daily Pixar Shorts - FREE Tier No Billing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      - name: Generate 10 Pixar Shorts FREE - Like example image
        run: python main_final_pixar_free.py
      - uses: actions/upload-artifact@v4
        with:
          name: pixar-free-${{ github.run_number }}
          path: FINAL_10_SHORTS/*.mp4
          retention-days: 7
