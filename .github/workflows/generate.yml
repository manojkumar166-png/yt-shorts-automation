name: daily-shorts

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

concurrency: 
  group: shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - name: Install Python Dependencies
        run: pip install -r requirements.txt

      - name: Ensure clean state.json exists
        run: |
          python -c "import json, os; f = 'state.json'; d = json.load(open(f)) if os.path.exists(f) and os.path.getsize(f) > 0 else {'done': [], 'failed': {}, 'log': []}; json.dump(d, open(f, 'w'), indent=2)"

      - name: Generate Videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: List Files (Debug)
        run: ls -la output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ github.run_id }}
          path: output/
          retention-days: 7

      - name: Commit State
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          git add state.json || echo "No state.json to add"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update state [skip ci]"
            for i in 1 2 3; do 
              git pull --rebase && git push && break
              sleep 5
            done
          fi