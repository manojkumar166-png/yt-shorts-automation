name: daily-shorts

on:
  schedule:
    - cron: "30 3 * * *" # Runs at 3:30 AM UTC every day
  workflow_dispatch:     # Allows you to click "Run" manually

concurrency: 
  group: shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - run: pip install -r requirements.txt
      
      # Ensure state.json exists before running the script
      - name: Ensure state.json exists
        run: |
          if [ ! -f state.json ]; then
            echo '{"done": [], "failed": {}, "log": []}' > state.json
          fi

      - name: Generate Videos
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: python main.py

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: videos-${{ github.run_id }}
          path: output/*.mp4
          retention-days: 7

      - name: Commit State
        if: always()
        run: |
          git config user.name "shorts-bot"
          git config user.email "shorts-bot@users.noreply.github.com"
          
          # Always add the state file
          git add state.json || echo "No state.json to add"
          
          # Only commit if there are actual changes
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "update state [skip ci]"
            for i in 1 2 3; do 
              git pull --rebase && git push && break
              sleep 5
            done
          fi
