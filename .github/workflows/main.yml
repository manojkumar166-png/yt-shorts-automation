name: Daily 【entity-Pixar¦canonical_name=Pixar】 Shorts - FREE Tier No Billing

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies - FIXED no requirements.txt needed
        run: pip install moviepy==1.0.3 edge-tts==6.1.10 Pillow==10.4.0 numpy==1.26.4 requests gTTS
      - name: Generate 10 Pixar Shorts FREE - Like example image
        run: python main_final_pixar_free.py
      - uses: actions/upload-artifact@v4
        with:
          name: pixar-free-${{ github.run_number }}
          path: FINAL_10_SHORTS/*.mp4
          retention-days: 7
