name: Generate Video

on:
  workflow_dispatch:
  push:
    paths:
      - "topics.txt"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install ImageMagick and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ffmpeg

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Generate video
        run: python main.py "black holes"

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: output/*.mp4
          retention-days: 7